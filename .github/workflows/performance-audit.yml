name: GoAcadio synthetic performance audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-browser-performance.mjs'
      - '.github/workflows/performance-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit production pages on mobile and desktop
        run: npm run audit:browser-performance
      - name: Upload screenshots and observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goacadio-performance
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 14
